[workspace]
resolver = "2"
members = ["src/formats", "apps/cli", "apps/conformance"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later"
repository = "https://github.com/XIVLegacy/xivl-tools"

[workspace.dependencies]
xivl-formats = { path = "src/formats" }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
